{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — Bytedocker</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="flex min-h-screen items-center justify-center bg-slate-100">
  <div class="w-full max-w-sm rounded-xl bg-white p-8 shadow">
    <h1 class="mb-6 text-xl font-bold tracking-tight">
      Bytedocker <span class="text-sky-500">🐳</span>
    </h1>
    {% if form.errors %}
      <div class="mb-4 rounded-md bg-red-50 px-3 py-2 text-sm text-red-700">
        Invalid email or password.
      </div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <label class="mb-1 block text-sm font-medium" for="id_username">Email</label>
      <input id="id_username" name="username" type="email" autofocus required
             class="mb-4 w-full rounded-md border border-slate-300 px-3 py-2 text-sm">
      <label class="mb-1 block text-sm font-medium" for="id_password">Password</label>
      <input id="id_password" name="password" type="password" required
             class="mb-6 w-full rounded-md border border-slate-300 px-3 py-2 text-sm">
      <button class="w-full rounded-md bg-slate-900 py-2 text-sm font-medium text-white hover:bg-slate-700">
        Log in
      </button>
    </form>
  </div>
</body>
</html>
