<div class="fixed inset-0 z-40 flex items-center justify-center bg-slate-900/40 p-4">
  <div class="max-h-[90vh] w-full max-w-lg overflow-y-auto rounded-xl bg-white p-6 shadow-xl">
    <div class="mb-4 flex items-center justify-between">
      <h2 class="text-base font-semibold">{{ modal_title }}</h2>
      <button type="button" class="text-slate-400 hover:text-slate-600"
              onclick="document.getElementById('modal-slot').innerHTML=''">✕</button>
    </div>
    <form hx-post="{{ action }}" hx-target="#modal-slot" hx-swap="innerHTML">
      {% csrf_token %}
      {% for field in form %}
        <div class="mb-3">
          <label class="mb-1 block text-sm font-medium" for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% for error in field.errors %}<p class="mt-1 text-xs text-red-600">{{ error }}</p>{% endfor %}
        </div>
      {% endfor %}
      {% for error in form.non_field_errors %}<p class="mb-2 text-xs text-red-600">{{ error }}</p>{% endfor %}
      <div class="mt-5 flex justify-end gap-2">
        <button type="button" class="btn-secondary"
                onclick="document.getElementById('modal-slot').innerHTML=''">Cancel</button>
        <button class="btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>
