{% extends "base.html" %}
{% load ui %}
{% block page_title %}Companies{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">Companies</h1>
    <p class="page-subtitle">Accounts in your pipeline.</p>
  </div>
  <button hx-get="{% url 'company-create' %}" hx-target="#modal-slot" class="btn-primary shrink-0">{% icon "plus" class="h-4 w-4" %}New company</button>
</div>
<form hx-get="{% url 'companies' %}" hx-target="#companies-table" hx-push-url="true"
      hx-trigger="submit, refresh-companies from:body" class="mb-4 flex gap-2">
  <div class="relative">
    <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-neutral-400">{% icon "search" class="h-4 w-4" %}</span>
    <input name="q" value="{{ request.GET.q|default:'' }}" placeholder="Search name or domain…" class="input w-72 pl-9">
  </div>
  <button class="btn-secondary">{% icon "search" class="h-4 w-4" %}Search</button>
</form>
<div id="companies-table">{% include "pipeline/_companies_table.html" %}</div>
{% endblock %}
