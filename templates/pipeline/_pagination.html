{% load ui %}
{% if page.paginator.num_pages > 1 %}
<div class="mt-3 flex items-center justify-end gap-2 text-sm">
  <span class="text-neutral-500">Page {{ page.number }} / {{ page.paginator.num_pages }}
    · {{ page.paginator.count }} total</span>
  {% if page.has_previous %}
    <a class="btn-secondary cursor-pointer" hx-get="?{% qs_replace page=page.previous_page_number %}"
       hx-target="{{ target }}" hx-push-url="true">‹ Prev</a>
  {% endif %}
  {% if page.has_next %}
    <a class="btn-secondary cursor-pointer" hx-get="?{% qs_replace page=page.next_page_number %}"
       hx-target="{{ target }}" hx-push-url="true">Next ›</a>
  {% endif %}
</div>
{% endif %}
