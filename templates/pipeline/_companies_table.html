<div class="card overflow-hidden p-0">
  <table class="w-full">
    <thead class="bg-slate-50">
      <tr>
        <th class="th">Name</th><th class="th">Domain</th><th class="th">Industry</th>
        <th class="th">Contacts</th><th class="th"></th>
      </tr>
    </thead>
    <tbody class="divide-y divide-slate-100">
      {% for company in page %}
      <tr class="hover:bg-slate-50">
        <td class="td"><a class="font-medium hover:underline" href="{% url 'company-detail' company.pk %}">{{ company.name }}</a></td>
        <td class="td">{{ company.domain|default:"—" }}</td>
        <td class="td">{{ company.industry|default:"—" }}</td>
        <td class="td">{{ company.num_contacts }}</td>
        <td class="td text-right">
          <button hx-get="{% url 'company-edit' company.pk %}" hx-target="#modal-slot"
                  class="text-sm text-slate-400 hover:text-slate-700">Edit</button>
        </td>
      </tr>
      {% empty %}
      <tr><td colspan="5" class="td py-10 text-center text-slate-400">No companies yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% include "pipeline/_pagination.html" %}
