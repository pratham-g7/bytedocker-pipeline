<div class="fixed inset-0 z-40 flex items-center justify-center bg-ink/50 p-4">
  <div class="max-h-[90vh] w-full max-w-xl overflow-y-auto rounded-lg border border-neutral-200 bg-white p-6 shadow-xl">
    <div class="mb-4 flex items-center justify-between">
      <h2 class="text-base font-semibold">Step {{ step.order }} — {{ step.template.name }}</h2>
      <button type="button" class="text-neutral-400 hover:text-neutral-600"
              onclick="document.getElementById('modal-slot').innerHTML=''">✕</button>
    </div>
    <div class="rounded-lg border border-neutral-200">
      <div class="border-b border-neutral-100 bg-neutral-50 px-4 py-3">
        <div class="text-xs uppercase tracking-wide text-neutral-400">Subject</div>
        <div class="text-sm font-medium">{{ subject }}</div>
      </div>
      <div class="px-4 py-4 text-sm leading-relaxed">{{ body_html|safe }}</div>
    </div>
    <p class="mt-2 text-xs text-neutral-400">
      Sample contact: {{ sample.full_name }} · {{ sample.title }} · {{ sample.company }}
    </p>
  </div>
</div>
