<div class="fixed inset-0 z-40 flex items-center justify-center bg-slate-900/40 p-4">
  <div class="max-h-[90vh] w-full max-w-xl overflow-y-auto rounded-xl bg-white p-6 shadow-xl">
    <div class="mb-4 flex items-center justify-between">
      <h2 class="text-base font-semibold">Step {{ step.order }} — {{ step.template.name }}</h2>
      <button type="button" class="text-slate-400 hover:text-slate-600"
              onclick="document.getElementById('modal-slot').innerHTML=''">✕</button>
    </div>
    <div class="rounded-lg border border-slate-200">
      <div class="border-b border-slate-100 bg-slate-50 px-4 py-3">
        <div class="text-xs uppercase tracking-wide text-slate-400">Subject</div>
        <div class="text-sm font-medium">{{ subject }}</div>
      </div>
      <div class="px-4 py-4 text-sm leading-relaxed">{{ body_html|safe }}</div>
    </div>
    <p class="mt-2 text-xs text-slate-400">
      Sample contact: {{ sample.full_name }} · {{ sample.title }} · {{ sample.company }}
    </p>
  </div>
</div>
