{% load ui %}
<div class="fixed inset-0 z-40 flex items-center justify-center bg-ink/50 p-4 backdrop-blur-[2px] motion-safe:animate-[overlay-in_140ms_ease-out]"
     x-data
     @keydown.escape.window="document.getElementById('modal-slot').innerHTML=''"
     @click.self="document.getElementById('modal-slot').innerHTML=''">
  <div class="max-h-[90vh] w-full max-w-xl overflow-y-auto rounded-2xl border border-neutral-200 bg-white p-6 shadow-pop motion-safe:animate-[panel-in_200ms_cubic-bezier(0.16,1,0.3,1)]">
    <div class="mb-4 flex items-center justify-between">
      <h2 class="font-display text-base font-bold text-ink">Step {{ step.order }} — {{ step.template.name }}</h2>
      <button type="button" class="btn-ghost -mr-1 h-8 w-8 p-0"
              onclick="document.getElementById('modal-slot').innerHTML=''" aria-label="Close">{% icon "x" class="h-4 w-4" %}</button>
    </div>
    <div class="rounded-lg border border-neutral-200">
      <div class="border-b border-neutral-100 bg-neutral-50 px-4 py-3">
        <div class="text-xs uppercase tracking-wide text-neutral-400">Subject</div>
        <div class="text-sm font-medium">{{ subject }}</div>
      </div>
      <div class="px-4 py-4 text-sm leading-relaxed">{{ body_html|safe }}</div>
    </div>
    <p class="mt-2 text-xs text-neutral-400">
      Sample contact: {{ sample.full_name }} · {{ sample.title }} · {{ sample.company }}
    </p>
  </div>
</div>
