{% extends "base.html" %}
{% load ui %}
{% block page_title %}Sequences{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">Sequences</h1>
    <p class="page-subtitle">Multi-step email sequences sent from connected mailboxes.</p>
  </div>
  <button hx-get="{% url 'sequence-create' %}" hx-target="#modal-slot" class="btn-primary shrink-0">{% icon "plus" class="h-4 w-4" %}New sequence</button>
</div>
<div id="sequences-table" hx-get="{% url 'sequences' %}" hx-trigger="refresh-sequences from:body">
  {% include "outreach/_sequences_table.html" %}
</div>
{% endblock %}
