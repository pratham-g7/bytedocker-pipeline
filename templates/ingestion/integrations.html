{% extends "base.html" %}
{% block page_title %}Integrations{% endblock %}
{% block content %}
<div class="mb-4 flex items-center justify-between gap-4">
  <p class="text-sm text-neutral-500">Capture leads via a hosted form or a signed webhook.</p>
  <button hx-get="{% url 'integration-create' %}" hx-target="#modal-slot" class="btn-primary shrink-0">
    New intake source
  </button>
</div>
<div id="integrations" hx-get="{% url 'integrations' %}" hx-trigger="refresh-integrations from:body">
  {% include "ingestion/_integrations.html" %}
</div>
{% endblock %}
